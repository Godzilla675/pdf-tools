name: Build and Release Desktop Apps (macOS & Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check application
        run: npm run lint

      - name: Build Frontend and Package macOS Installers (arm64 & x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac

      - name: Verify macOS Code Signatures, Architectures, and Live Apple Silicon Launch
        run: |
          set -euo pipefail
          ls -lh release/

          for dmg in release/*.dmg; do
            echo "=== Verifying DMG: $dmg ==="
            MOUNT_DIR=$(mktemp -d /tmp/verify-dmg.XXXXXX)
            hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$dmg"
            APP_BUNDLE="$MOUNT_DIR/pdf tools.app"
            test -d "$APP_BUNDLE"

            /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
            SIGN_INFO=$(/usr/bin/codesign -dvv "$APP_BUNDLE" 2>&1)
            echo "$SIGN_INFO"
            if echo "$SIGN_INFO" | grep -qE "linker-signed|Info\.plist=not bound|Sealed Resources=none"; then
              echo "ERROR: Invalid or incomplete signature in $dmg"
              hdiutil detach "$MOUNT_DIR" -force || true
              exit 1
            fi

            BIN_ARCH=$(file "$APP_BUNDLE/Contents/MacOS/pdf tools")
            echo "Binary architecture: $BIN_ARCH"
            if [[ "$dmg" == *"-arm64.dmg" ]]; then
              echo "$BIN_ARCH" | grep -q "arm64"
              echo "=== Running live Apple Silicon launch smoke test from $dmg ==="
              SMOKE_DIR=$(mktemp -d /tmp/smoke-app.XXXXXX)
              ditto "$APP_BUNDLE" "$SMOKE_DIR/pdf tools.app"
              /usr/bin/codesign --verify --deep --strict "$SMOKE_DIR/pdf tools.app"
              PDF_TOOLS_SMOKE_TEST=1 "$SMOKE_DIR/pdf tools.app/Contents/MacOS/pdf tools" --no-sandbox
              rm -rf "$SMOKE_DIR"
            elif [[ "$dmg" == *"-x64.dmg" ]]; then
              echo "$BIN_ARCH" | grep -q "x86_64"
            fi

            hdiutil detach "$MOUNT_DIR" -force
            rmdir "$MOUNT_DIR" || true
          done

          for zip in release/*.zip; do
            echo "=== Verifying ZIP: $zip ==="
            UNZIP_DIR=$(mktemp -d /tmp/verify-zip.XXXXXX)
            ditto -xk "$zip" "$UNZIP_DIR"
            APP_BUNDLE="$UNZIP_DIR/pdf tools.app"
            test -d "$APP_BUNDLE"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
            rm -rf "$UNZIP_DIR"
          done

      - name: Upload macOS Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: pdf-tools-macOS-Installers
          path: |
            release/*.dmg
            release/*.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend and Package Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:win

      - name: List generated release files
        shell: bash
        run: ls -lh release/

      - name: Upload Windows Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: pdf-tools-Windows-Installers
          path: |
            release/*.exe

  publish-release:
    if: github.event_name != 'pull_request'
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${PKG_VERSION}"
            TAG_NAME="v${PKG_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display downloaded files
        run: ls -R artifacts/

      - name: Flatten release files and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find artifacts/ -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-files/ \;
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          ls -lh release-files/
          cat release-files/SHA256SUMS.txt

      - name: Create or Update GitHub Release with Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "pdf tools ${{ steps.version.outputs.tag }} (Desktop Offline Edition)"
          body: |
            ## pdf tools Desktop ${{ steps.version.outputs.tag }} (100% Offline)

            ### What's Fixed in ${{ steps.version.outputs.tag }}
            - **Fixed Apple Silicon (M1 / M2 / M3 / M4 / M5) "app is damaged and can't be opened" error:** macOS app bundles are now properly ad-hoc code signed with bound `Info.plist` and sealed resources and verified with `codesign --verify --deep --strict` plus a live Apple Silicon launch test in CI.
            - **Added both Apple Silicon (`arm64`) and Intel (`x64`) macOS builds.**
            - **Fixed macOS window title bar overlap** so traffic-light buttons no longer sit on top of the navigation bar.

            ---

            Download the installer for your operating system below:

            ### macOS
            - **Apple Silicon (M1 / M2 / M3 / M4 / M5):** `pdf-tools-${{ steps.version.outputs.version }}-arm64.dmg` (or `pdf-tools-${{ steps.version.outputs.version }}-arm64.zip`)
            - **Intel Mac:** `pdf-tools-${{ steps.version.outputs.version }}-x64.dmg` (or `pdf-tools-${{ steps.version.outputs.version }}-x64.zip`)

            > **First launch on macOS (ad-hoc signed / not Apple-notarized):**
            > 1. Drag `pdf tools.app` into **Applications** and double-click to open it once.
            > 2. If macOS displays *"Apple could not verify 'pdf tools' is free of malware"*, click **Done**, then open **System Settings → Privacy & Security → Security** and click **Open Anyway**.
            > 3. Alternatively, run this once in Terminal:
            >    ```bash
            >    /usr/bin/xattr -dr com.apple.quarantine "/Applications/pdf tools.app"
            >    ```

            ### Windows
            - **Installer (.exe):** `pdf.tools.Setup.${{ steps.version.outputs.version }}.exe` (NSIS installer with Desktop and Start Menu shortcuts)
            - **Portable (.exe):** `pdf.tools.${{ steps.version.outputs.version }}.exe` (Standalone single file executable, no installation needed)

            > **First launch on Windows (SmartScreen):** If Windows SmartScreen appears, click **More info** -> **Run anyway**.
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
