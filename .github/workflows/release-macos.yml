name: Build and Release macOS DMG

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend and Package macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: List generated release files
        run: ls -lh release/

      - name: Upload DMG Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Mono-PDF-macOS-Installers
          path: |
            release/*.dmg
            release/*.zip

      - name: Create or Update GitHub Release with DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Mono PDF v1.0.0 (macOS Offline Edition)"
          body: |
            ## Mono PDF for macOS (100% Offline)
            Download the `.dmg` installer for your Mac below:
            - **Apple Silicon (M1 / M2 / M3 / M4):** `Mono PDF-1.0.0-arm64.dmg`
            - **Intel Mac:** `Mono PDF-1.0.0.dmg`

            > **Note on first launch (Unsigned App):** If macOS says the app is unverified or cannot be opened, right-click `Mono PDF.app` -> click **Open**, or run:
            > `xattr -cr "/Applications/Mono PDF.app"` in Terminal.
          draft: false
          prerelease: false
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
